<!DOCTYPE html>
<html>
<head>
    <title>Used Vehicle Price Predictor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #d2d7dc;
            color: #0a0909;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #555;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #777;
        }
        .result {
    margin-top: 20px;
    padding: 15px;
    text-align: center;
    background: #f1f1f1;
    border-radius: 6px;
}

.result h2 {
    margin: 0 0 8px;
    font-size: 20px;
}

.result p {
    margin: 0;
    font-size: 26px;
    font-weight: bold;
}
    </style>
</head>

<body>

    <div class="container">

        <h1> Used Vehicle Price Predictor</h1>

        <p class="subtitle">
            Enter vehicle details to estimate its selling price.
        </p>

        <form action="/predict" method="POST">

            <label>Vehicle Brand</label>
            <input type="text" name="brand"
                   placeholder="e.g. Maruti" required>

            <label>Vehicle Age</label>
            <input type="number" name="age"
                   placeholder="e.g. 10" required>

            <label>Kilometers Driven</label>
            <input type="number" name="km_driven"
                   placeholder="e.g. 70000" required>

            <label>Fuel Type</label>
            <select name="fuel" required>
                <option value="">Select Fuel</option>
                <option value="Petrol">Petrol</option>
                <option value="Diesel">Diesel</option>
                <option value="CNG">CNG</option>
                <option value="LPG">LPG</option>
                <option value="Electric">Electric</option>
            </select>

            <label>Seller Type</label>
            <select name="seller_type" required>
                <option value="">Select Seller Type</option>
                <option value="Individual">Individual</option>
                <option value="Dealer">Dealer</option>
                <option value="Trustmark Dealer">Trustmark Dealer</option>
            </select>

            <label>Transmission</label>
            <select name="transmission" required>
                <option value="">Select Transmission</option>
                <option value="Manual">Manual</option>
                <option value="Automatic">Automatic</option>
            </select>

            <label>Owner</label>
            <select name="owner" required>
                <option value="">Select Owner</option>
                <option value="First Owner">First Owner</option>
                <option value="Second Owner">Second Owner</option>
                <option value="Third Owner">Third Owner</option>
                <option value="Fourth & Above Owner">Fourth & Above Owner</option>
                <option value="Test Drive Car">Test Drive Car</option>
            </select>

            <button type="submit">Predict Price</button>
            {% if prediction %}
    <div class="result">
        <h2>Estimated Selling Price</h2>
        <p>{{ prediction }}</p>
    </div>
           {% endif %}

        </form>

        <p class="footer">
            Machine Learning Based Vehicle Price Prediction
        </p>

    </div>

</body>
</html>
